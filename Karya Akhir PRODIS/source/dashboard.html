<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Dashboard</title>
</head>
<style>
</style>
<body>
    <nav>
        <div style="display: flex; gap: 10px; justify-content: center; align-items: center;">
            <img src="../image/man.png" alt="">
            <h1>Dashboard Laporan Uang Kas</h1>
        </div>

        <h1>Bendahara</h1>
        <label class="switch">
            <input type="checkbox" id="toogle">
            <span class="slider"></span>
        </label>

    </nav>
    <div class="container-card">
        <div class="card-1">
            <h3>Total Saldo</h3>
            <h2 id="total-saldo">Rp0</h2>
        </div>
        <div class="card-1">
            <h3>Saldo Bulan Ini </h3>
            <h2 id="saldo">Rp0</h2>
        </div>
        <div class="card-1">
            <h3>Jumlah Siswa </h3>
            <h2 id="jumlah-siswa">0 Siswa</h2>
        </div>
    </div>
    <div class="container-nav">
        <h2 style="margin-top: 20px; margin-bottom: 20px;">Filter Dan Navigasi</h2>
        <div>
            <label for="">Bulan: </label>
            <select name="" id="bulan">
                <option value="Januari">Januari</option>
                <option value="February">February</option>
                <option value="Maret">Maret</option>
                <option value="April">April</option>
                <option value="Mei">Mei</option>
                <option value="Juni">Juni</option>
                <option value="July">July</option>
                <option value="Agustus">Agustus</option>
                <option value="September">September</option>
                <option value="Oktober">Oktober</option>
                <option value="November">November</option>
                <option value="Desember">Desember</option>
            </select>
        </div>

        <div class="judul-bulan">
            <h2 id="judul-bulan">Januari</h2>
            <p>Rekapitulasi kas kelas</p>
        </div>
        
    </div>
    <div class="container-input">
        <input type="text" placeholder="Tambah Siswa" class="input" id="input">
        <button class="btn-in" id="tambah">Add</button>
    </div>
    <table>
        <thead>
            <tr>
                <th>No</th>
                <th>Nama</th>
                <th>Minggu 1</th>
                <th>Minggu 2</th>
                <th>Minggu 3</th>
                <th>Minggu 4</th>   
                <th>Total</th>
                <th>Aksi</th>
            </tr>
        </thead>
        <tbody id="data-siswa">

        </tbody>
    </table>
    <footer class="footer">
        <p>© 2026 Satria. All rights reserved.</p>
        <p class="footer-sub">Designed &amp; Developed by Satria</p>
    </footer>
</body>
<script src="script.js"></script>
</html>
